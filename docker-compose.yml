version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: lostfound-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - lostfound-net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: lostfound-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TEXT_MODEL_NAME=sentence-transformers/all-mpnet-base-v2
      - IMAGE_MODEL_NAME=openai/clip-vit-base-patch32
    networks:
      - lostfound-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lostfound-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=mongodb://mongodb:27017/lost-and-found
      - JWT_SECRET=super-secret-jwt-key-for-ai-lost-found-2026
      - ML_SERVICE_URL=http://ml-service:8000
      - MATCH_THRESHOLD=0.75
      - POSSIBLE_MATCH_THRESHOLD=0.60
      - WEIGHT_TEXT=0.50
      - WEIGHT_IMAGE=0.50
    depends_on:
      - mongodb
      - ml-service
    volumes:
      - server-uploads:/app/uploads
    networks:
      - lostfound-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lostfound-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server
    networks:
      - lostfound-net

networks:
  lostfound-net:
    driver: bridge

volumes:
  mongo-data:
  server-uploads:
